[package]
name = "ach-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# Achronyme crates (from main repo).
# Pin to an explicit rev so `cargo build --locked` is reproducible even
# if upstream `main` advances between a push and this deploy.
# Tracks the beta.22 release tag — picks up end-to-end secp256k1 ECDSA
# witness generation via native Artik bignum intrinsics and the R1CS
# substitution soundness fix.
akronc = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
akron = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
zkc = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
memory = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
ir = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
ir-forge = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
circom = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
constraints = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
diagnostics = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
achronyme-std = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }
achronyme-parser = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }

# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
tower_governor = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Proving backends (shared crate)
proving = { git = "https://github.com/achronyme/achronyme", rev = "0ab27721a81283547b8c51172f72355a554bd2dc" }

# Session management
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

# Encoding
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Drive the axum Router from integration tests without a TCP listener.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
