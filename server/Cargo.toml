[package]
name = "ach-server"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# Achronyme crates (from main repo).
# Pin to an explicit rev so `cargo build --locked` is reproducible even
# if upstream `main` advances between a push and this deploy.
# Pinned to the core 0.1.1 release revision. This keeps the shared
# `prove-engine` crate on the same compile/prove/verify path as the CLI
# and retains R1CS optimization on the prove path.
akronc = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
akron = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
zkc = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
memory = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
ir = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
ir-forge = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
circom = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
constraints = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
diagnostics = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
achronyme-std = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }
achronyme-parser = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }

# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
tower_governor = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Proving backends (shared crate)
proving = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }

# Shared compile→prove→verify engine (same code path as the CLI's
# DefaultProveHandler — replaces the previously hand-copied, divergent
# server prove handler that proved over un-optimized R1CS).
prove-engine = { git = "https://github.com/achronyme/achronyme", rev = "b1774e88671a1889146804cb812cb099eb9cc006" }

# Session management
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

# Encoding
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Drive the axum Router from integration tests without a TCP listener.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.test]
# Keep proof integration tests representative of the optimized server. Fully
# unoptimized Groth16 arithmetic exceeds the production request timeout even
# though the same SHA-256 proof finishes within the budget in release builds.
opt-level = 1
