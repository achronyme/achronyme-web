# Canonical Nginx vhost for the public playground API.
#
# Install on the host that serves play.achrony.me:
#
#   sudo install -m 0644 deploy/nginx/play.achrony.me.conf \
#       /etc/nginx/conf.d/play-achronyme.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# The surrounding Nginx http context must define these shared zones:
#
#   limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
#   limit_req_zone $binary_remote_addr zone=api_run:10m rate=20r/m;
#   limit_req_zone $binary_remote_addr zone=api_session:10m rate=120r/m;
#   limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    server_name play.achrony.me;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Preserve CORS on rate-limit responses generated by Nginx.
    error_page 429 = @rate_limited;
    location @rate_limited {
        add_header Access-Control-Allow-Origin "https://achrony.me" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Ach-Session" always;
        add_header Retry-After 10 always;
        default_type application/json;
        return 429 '{"error":"rate limit exceeded - please wait a moment"}';
    }

    limit_conn conn_limit 10;

    # Execution endpoints receive the strictest request budget.
    location /api/run {
        limit_req zone=api_run burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
        client_max_body_size 64k;
    }

    location /api/prove {
        limit_req zone=api_run burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        proxy_connect_timeout 3s;
        client_max_body_size 64k;
    }

    # Circuit proving can consume the full server request timeout.
    location /api/circuit {
        limit_req zone=api_run burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        proxy_connect_timeout 3s;
        client_max_body_size 64k;
    }

    # Session creation has a separate anti-flood budget.
    location /api/session {
        limit_req zone=api_session burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
        client_max_body_size 16k;
    }

    # General API endpoints cover files, compilation, and inspection.
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
        client_max_body_size 64k;
    }

    # Health and release identity are exact, read-only, unmetered probes.
    location = /health {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    location = /version {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    # No unreviewed server route is public by default.
    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/play.achrony.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/play.achrony.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = play.achrony.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name play.achrony.me;
    return 404; # managed by Certbot
}
