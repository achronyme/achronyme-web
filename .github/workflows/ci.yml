name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: sh -n public/install.sh
      - run: test/install_script_contract.sh

  server:
    name: Server (format, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path server/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path server/Cargo.toml --locked -- -D warnings
      - run: cargo test --release --manifest-path server/Cargo.toml --locked
      - run: test/server_source_contract.sh
